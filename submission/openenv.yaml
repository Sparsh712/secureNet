spec_version: 1
name: securenet_env
version: "1.0.0"
description: "SOC Simulation: Stateful POMDP for Autonomous Digital Defense"
type: space
runtime: fastapi
app: server.app:app
port: 8000

environment:
  spec: "server/securenet_environment.py:SecureNetEnvironment"
  state_space: "Hidden (in-memory network graph of nodes)"
  action_space:
    - "QUERY_LOGS"
    - "ANALYZE_PROCESS"
    - "ISOLATE_HOST"
    - "BLOCK_IP"
    - "THREAT_INTEL"
    - "QUARANTINE_PROCESS"

hardware_limits:
  vcpu: 2
  ram_gb: 8
  storage: "In-Memory"

reward_function:
  # Per-step baseline
  step_penalty:          -0.02   # applied every step regardless of action

  # QUERY_LOGS
  query_logs_new:        +0.10   # first time querying a node
  query_logs_repeat:     -0.02   # penalty for re-querying the same node
  query_infected:        +0.25   # bonus for discovering an infected node's logs

  # ANALYZE_PROCESS
  analyze_hit:           +0.40   # malicious process found (first time); x0.3 on repeat
  analyze_miss:          -0.02   # no suspicious process found; x2.0 penalty on repeat

  # THREAT_INTEL
  threat_intel_hit:      +0.25   # IOC/IP matched in threat database
  threat_intel_miss:     -0.01   # IOC not found in database

  # BLOCK_IP
  block_ip:              +0.50   # successfully blocked a known attacker IP
  block_ip_repeat:       -0.05   # IP was already blocked

  # QUARANTINE_PROCESS
  quarantine_hit:        +0.60   # malicious process successfully terminated
  quarantine_miss:       -0.10   # process not found / wrong target

  # ISOLATE_HOST
  isolate_infected:      +1.00   # correctly isolated a compromised node
  isolate_healthy:       -0.80   # false positive — isolated a clean node
  catastrophic:          -3.00   # isolated critical infrastructure → episode ends (score=0)

difficulty_tiers:
  easy:      "2 nodes, 1 compromised, 20 steps, no adversarial drift"
  medium:    "4 nodes, 2 compromised, 25 steps, no adversarial drift"
  hard:      "6 nodes, 2 compromised, 30 steps, adversarial drift every 3 steps"
  critical:  "8 nodes, 4 compromised, 35 steps, rapid adversarial drift"
  nightmare: "12 nodes, 6 compromised, 40 steps, full APT simulation"

inference:
  playbook_baseline: "inference.py"
  llm_baseline:      "inference_llm.py"
